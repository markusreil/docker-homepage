name: homepage

x-hosts:
  homepage: &host-homepage homepage.${BASE_DOMAIN:?BASE_DOMAIN must be set in .env}

services:
  homepage:
    # local build: upstream homepage image with the tracked config baked in
    # (homepage/docker/*.yaml, see homepage/Dockerfile)
    image: homepage:${HOMEPAGE_VERSION:?HOMEPAGE_VERSION must be set in .env}
    build:
      context: ./homepage
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # homepage only serves this vhost (ingress is via nginx-proxy; no ports)
      HOMEPAGE_ALLOWED_HOSTS: *host-homepage
      # complete downstream proxy contract: both TLS opt-ins are declared and
      # the proxy variant decides which one applies.
      VIRTUAL_HOST: *host-homepage
      VIRTUAL_PORT: "3000"
      ACME_HOST: *host-homepage
      GEN_SELF_SIGNED_CERT: ${HOMEPAGE_GEN_SELF_SIGNED_CERT:-false}
      # homepage dashboard title template var (see settings.yaml)
      HOMEPAGE_VAR_BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be set in .env}
    volumes:
      # docker socket (special-case bind mount) for container discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "3000"
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK:-web-proxy}
