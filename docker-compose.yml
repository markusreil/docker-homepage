name: homepage

x-hosts:
  virtual_host: &virtual_host VIRTUAL_HOST=homepage.${BASE_DOMAIN:?BASE_DOMAIN must be set in .env}
  letsencrypt_host: &letsencrypt_host LETSENCRYPT_HOST=homepage.${BASE_DOMAIN:?BASE_DOMAIN must be set in .env}
  allowed_hosts: &allowed_hosts HOMEPAGE_ALLOWED_HOSTS=localhost,homepage.${BASE_DOMAIN:?BASE_DOMAIN must be set in .env}

services:
  homepage:
    # local build: upstream homepage image with the tracked config baked in
    # (homepage/docker/docker.yaml, see homepage/Dockerfile)
    image: homepage:${HOMEPAGE_VERSION:?HOMEPAGE_VERSION must be set in .env}
    build:
      context: ./homepage
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - *allowed_hosts
      # nginx-proxy: the vhost is the service name + BASE_DOMAIN
      - *virtual_host
      - VIRTUAL_PORT=3000
      - *letsencrypt_host
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "3000"
    networks:
      - default
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK:?NGINX_PROXY_NETWORK must be set in .env}
